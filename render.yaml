# Render Blueprint — creates the whole service from this file.
#
# On Render: New → Blueprint → pick this repository. Everything below is applied
# automatically; you are only asked for the two values marked `sync: false`,
# which are secrets that must not live in a git repository.
#
# The frontend is built first and served by the API process itself
# (SERVE_FRONTEND), so the whole system runs on one origin and one port — no
# CORS, no separate static host.

services:
  - type: web
    name: remittance-office
    runtime: node
    plan: free
    region: frankfurt
    branch: main

    # `--include=dev` is explicit because NODE_ENV=production otherwise makes
    # npm skip devDependencies — which is where TypeScript, Vite and the type
    # packages live, so the build would fail before it started.
    buildCommand: cd frontend && npm ci --include=dev && npm run build && cd ../backend && npm ci --include=dev && npm run build
    startCommand: cd backend && npm start

    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"

      # Serve the built UI from the API process.
      - key: SERVE_FRONTEND
        value: "true"
      - key: FRONTEND_DIST
        value: ../frontend/dist

      # A free tier has no shell, so the schema and the base data have to arrive
      # with the deploy. Both steps are idempotent and safe on every restart.
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "true"
      - key: SEED_ON_BOOT
        value: "true"

      - key: DB_SSL
        value: "true"
      - key: DB_SYNCHRONIZE
        value: "false"

      - key: COOKIE_SECURE
        value: "true"
      - key: DEFAULT_LANGUAGE
        value: ar
      - key: BASE_CURRENCY
        value: SYP
      - key: LOG_LEVEL
        value: info

      # Generated by Render, never stored in the repository.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "12"

      - key: SEED_ADMIN_USERNAME
        value: admin
      - key: SEED_ADMIN_FULLNAME
        value: System Administrator

      # --- asked for once, at blueprint creation ------------------------------
      # The first administrator password. Pick a strong one: the seeder hashes
      # it as given and does not apply the password policy the API enforces on
      # its own endpoints.
      - key: SEED_ADMIN_PASSWORD
        sync: false

      # The PostgreSQL connection string, e.g. from Neon:
      #   postgresql://user:password@host/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
